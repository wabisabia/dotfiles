[user]
name = "Christian Dunn"
email = "chris@wabisabia.com"

[merge]
hunk-level = "word"

[git]
private-commits = "private"

[template-aliases]
"format_short_id(id)" = "id.shortest()"
"format_timestamp(timestamp)" = "timestamp.ago()"
"format_short_signature(signature)" = "truncate_end(8, signature.name(), '...')"
change_list = "'- ' ++ self.description().first_line() ++ '\n'"
change_list_bold = "'- **' ++ self.description().first_line() ++ '**\n'"

[ui]
default-command = [
  "log",
  "-r",
  "(present(@) | trunk() | (tracked_remote_bookmarks() & trunk()..) | branch_point | branch | (heads_since_branch_point & mutable())) & visible()",
]
diff-instructions = false
diff-editor = "diffe"
diff-formatter = "dt"

[aliases]
clone = ["git", "clone"]
d = ["diff"]
l = ["log"]
pull = ["git", "fetch"]
push = ["git", "push"]
pr = [
  "log",
  "--reversed",
  "--no-graph",
  "--template",
  "change_list",
  "--revisions",
  "pr",
]
ghpr = [
  "log",
  "--reversed",
  "--no-graph",
  "--template",
  "change_list_bold",
  "--revisions",
  "pr",
]

[revset-aliases]
"branch" = "branch(@)"
"branch(x)" = "branch_point(x)..fork_point(heads(x))"

"branch_point" = "branch_point(@)"
"branch_point(x)" = "fork_point(x | trunk())"

"pr" = "pr(@)"
"pr(x)" = "branch(x) & ~private & ~indescribable & ~description(glob:'Merge *')"

"heads_since_branch_point" = "heads_since_branch_point(@)"
"heads_since_branch_point(x)" = "heads(branch_point(x)::)"

indescribable = "description(exact:'') | empty()"
private = "description(glob:'{wip,private,optional}*')"

[templates]
draft_commit_description = "builtin_draft_commit_description_with_diff"

[merge-tools.diffe]
program = "nvim"
edit-args = [
  "-c",
  "HunkDiffEditor $left $right $output",
]

[merge-tools.dt]
program = "difft"
diff-args = [
  "--width=$width",
  "--color=always",
  "$left",
  "$right",
]

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
  "-c",
  "let g:jj_diffconflicts_marker_length=$marker_length",
  "-c",
  "JJDiffConflicts",
  "$output",
]

[merge-tools.hunk]
program = "sh"
diff-invocation-mode = "dir"
diff-do-chdir = false
conflict-marker-style = "snapshot"
diff-args = [
  "-c",
  'exec nvim -c "HunkDiffView $1 $2" </dev/tty >/dev/tty',
  "hunk-difftool",
  "$left",
  "$right",
]

merge-tool-edits-conflict-markers = true

[fix.tools.1-ruff-lint]
command = [
  "uv",
  "run",
  "ruff",
  "check",
  "--fix",
  "--quiet",
  "--stdin-filename=$path",
  "-"
]
patterns = ["glob:'**/*.py'"]

[fix.tools.2-ruff-format]
command = [
  "uv",
  "run",
  "ruff",
  "format",
  "--stdin-filename=$path",
  "-",
]
patterns = ["glob:'**/*.py'"]
